[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "dgc-sdk"
version = "0.6.7"
description = "Embed the DGC coding harness in applications and CI"
requires-python = ">=3.10"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Mohit Kalra" }]
keywords = ["dgc", "agent", "sdk", "coding-agent"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://vibedgc.com/sdk/"
Documentation = "https://github.com/OpenPeach-ai/dgc/blob/sdk-v0.6.7/docs/SDK.md"
Repository = "https://github.com/OpenPeach-ai/dgc"
Issues = "https://github.com/OpenPeach-ai/dgc/issues"
Changelog = "https://github.com/OpenPeach-ai/dgc/blob/sdk-v0.6.7/sdk/CHANGELOG.md"
Release = "https://github.com/OpenPeach-ai/dgc/releases/tag/sdk-v0.6.7"

[tool.setuptools.packages.find]
include = ["dgc_sdk*"]

[tool.setuptools.package-data]
dgc_sdk = ["py.typed"]
