<section class="section subscription-section">

      </form>
      <div class="subscription-links"><a href="/">Return home</a><a href="/privacy#forms-and-email">Privacy →</a><a href="/terms">Terms →</a></div>
      <noscript><p class="subscription-noscript">JavaScript is required. After the same-site redirect, the private token stays in this page’s URL fragment and is not sent when the review page loads.</p></noscript>
    </article>
  </div>
</section>
