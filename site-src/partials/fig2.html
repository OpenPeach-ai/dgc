  <div class="permission-wrap">
    <table class="permission-table">
      <thead><tr><th>Mode</th><th>Read files</th><th>Edit files</th><th>Shell</th><th>Use it for</th></tr></thead>
      <tbody>
        <tr><td class="mode-name">plan<small>read-only · proposes a plan</small></td><td><span class="gate allow" aria-label="runs without asking">●</span></td><td><span class="gate" aria-label="never in this mode">—</span></td><td><span class="gate" aria-label="never in this mode">—</span></td><td>Understand a codebase and review the proposal before model-requested edits or shell commands.</td></tr>

    </table>
