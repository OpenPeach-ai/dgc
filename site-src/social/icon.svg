<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">DGC application icon</title>
  <desc id="desc">Three violet DGC shards on a dark instrument-panel field.</desc>
  <defs>
    <linearGradient id="bg" x1="48" y1="24" x2="456" y2="488" gradientUnits="userSpaceOnUse">
      <stop stop-color="#17171A"/>
      <stop offset="0.58" stop-color="#0B0B0C"/>
      <stop offset="1" stop-color="#101014"/>
    </linearGradient>
    <radialGradient id="aura" cx="0" cy="0" r="1" gradientTransform="translate(282 222) rotate(90) scale(244)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7C5CFF" stop-opacity="0.32"/>
      <stop offset="0.48" stop-color="#7C5CFF" stop-opacity="0.09"/>
      <stop offset="1" stop-color="#7C5CFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shard" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#B8A5FF"/>
      <stop offset="0.34" stop-color="#8D70FF"/>
      <stop offset="1" stop-color="#6C49F2"/>
    </linearGradient>
    <pattern id="dots" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1.25" fill="#FFFFFF" opacity="0.055"/>
    </pattern>
    <filter id="glow" x="-45%" y="-35%" width="190%" height="190%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#dots)"/>
  <circle cx="282" cy="222" r="244" fill="url(#aura)"/>

  <g fill="none" stroke="#A6A6B0" stroke-opacity="0.12">
    <path d="M256 24V76M256 436V488M24 256H76M436 256H488"/>
    <rect x="18.5" y="18.5" width="475" height="475" rx="101.5" stroke="#FFFFFF" stroke-opacity="0.1"/>
    <rect x="31.5" y="31.5" width="449" height="449" rx="89.5" stroke="#232326" stroke-opacity="0.9"/>
  </g>

  <g transform="translate(35 30) scale(5)" fill="#7C5CFF" opacity="0.42" filter="url(#glow)">
    <path d="M32 24 20 30 13 72 25 66Z"/>
    <path d="M54 18 42 24 35 72 47 66Z"/>
    <path d="M76 24 64 30 57 66 69 60Z"/>
  </g>

  <g transform="translate(35 30) scale(5)" fill="url(#shard)" stroke="#C4B5FD" stroke-opacity="0.34" stroke-width="0.55" stroke-linejoin="round">
    <path d="M32 24 20 30 13 72 25 66Z"/>
    <path d="M54 18 42 24 35 72 47 66Z"/>
    <path d="M76 24 64 30 57 66 69 60Z"/>
  </g>

  <g transform="translate(35 30) scale(5)" fill="none" stroke="#FFFFFF" stroke-opacity="0.3" stroke-width="0.32" stroke-linecap="round">
    <path d="M20 30 32 24M42 24 54 18M64 30 76 24"/>
  </g>
</svg>
