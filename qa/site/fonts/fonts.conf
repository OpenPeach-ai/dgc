<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  The whole font environment of the site QA browser. playwright.config.mjs points Chromium's
  FONTCONFIG_FILE here, so the text in visual baselines never depends on what a machine has
  installed: no /etc/fonts, no /usr/share/fonts, no ~/.config/fontconfig.

  The site's own web fonts (Geist, JetBrains Mono) cover Latin. Everything else - arrows, check
  marks, dingbats - falls back to the two DejaVu faces in this directory (DejaVu 2.37, copied
  byte-for-byte from Ubuntu 24.04's fonts-dejavu-core and fonts-dejavu-mono; license in
  LICENSE-DejaVu.txt). DejaVu Sans Mono is also the local() face behind 'JetBrains Mono Fallback'
  in site-src/assets/tokens.css.

  Without this, a desktop with fonts-noto-core and msttcorefonts drew the arrows in Noto Sans Math
  and Arial, and a stock CI runner draws them in FreeSans or Unifont: 39 to 5,123 differing pixels
  per band. visual.spec.mjs fails with the offending text if any other font is ever used.
-->
<fontconfig>
  <!-- No cachedir: two faces scan instantly, and the browser then writes nothing anywhere. -->
  <dir prefix="relative">.</dir>

  <alias binding="same"><family>sans-serif</family><prefer><family>DejaVu Sans</family></prefer></alias>
  <alias binding="same"><family>serif</family><prefer><family>DejaVu Sans</family></prefer></alias>
  <alias binding="same"><family>system-ui</family><prefer><family>DejaVu Sans</family></prefer></alias>
  <alias binding="same"><family>monospace</family><prefer><family>DejaVu Sans Mono</family></prefer></alias>

  <!-- Rasterisation is pinned too. Distributions and desktops differ here (this machine's
       /etc/fonts sets sub-pixel RGB), and every one of these changes antialiased edge pixels. -->
  <match target="font">
    <edit name="antialias" mode="assign"><bool>true</bool></edit>
    <edit name="hinting" mode="assign"><bool>true</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintslight</const></edit>
    <edit name="autohint" mode="assign"><bool>false</bool></edit>
    <edit name="rgba" mode="assign"><const>none</const></edit>
    <edit name="lcdfilter" mode="assign"><const>lcddefault</const></edit>
    <edit name="embeddedbitmap" mode="assign"><bool>false</bool></edit>
  </match>
</fontconfig>
