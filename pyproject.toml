[build-system]
requires = ["setuptools>=77"]               # PEP 639 license fields (below) need 77
build-backend = "setuptools.build_meta"

[project]
name = "dgc"
dynamic = ["version"]                       # single-sourced from dgc/__init__.py __version__
description = "Interactive coding-agent CLI harness for local LLMs (Ollama, LM Studio, vLLM, llama.cpp)"
requires-python = ">=3.10"
license = "Apache-2.0"                      # an SPDX expression: the TOML table form stops building after 2027-02-18
license-files = ["LICENSE"]
authors = [{ name = "Mohit Kalra" }]
dependencies = ["rich==15.0.0", "prompt_toolkit==3.0.53", "requests==2.34.2", "ddgs==9.16.1",
                "pypdf==7.0.0"]

[project.urls]
Homepage = "https://vibedgc.com"
Repository = "https://github.com/OpenPeach-ai/dgc"
Issues = "https://github.com/OpenPeach-ai/dgc/issues"

[tool.setuptools.dynamic]
version = { attr = "dgc.__version__" }

[project.scripts]
dgc = "dgc.launch:main"

[tool.setuptools.packages.find]
include = ["dgc*"]

[tool.setuptools.package-data]
dgc = ["skills_builtin/*/SKILL.md", "skills_builtin/*/agents/openai.yaml", "schemas/*.json",
       "plugin_catalog.json", "connector_catalog.json", "bundled_plugins/*/skills/*/SKILL.md",
       "desktop_assets/*.png", "desktop_assets/*.jpg",
       "mods/py/*.py", "mods/builtin/*/dgc-mod.json", "mods/builtin/*/*.py"]
