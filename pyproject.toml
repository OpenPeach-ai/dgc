[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dgc"
version = "0.4.0"
description = "Interactive coding-agent CLI harness for local LLMs (Ollama, LM Studio, vLLM, llama.cpp)"
requires-python = ">=3.10"
dependencies = ["rich>=13", "prompt_toolkit>=3", "requests>=2.31"]

[project.scripts]
dgc = "dgc.cli:main"

[tool.setuptools.packages.find]
include = ["dgc*"]
