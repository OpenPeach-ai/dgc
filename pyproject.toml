[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dgc"
dynamic = ["version"]                       # single-sourced from dgc/__init__.py __version__
description = "Interactive coding-agent CLI harness for local LLMs (Ollama, LM Studio, vLLM, llama.cpp)"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Mohit Kalra" }]
dependencies = ["rich==15.0.0", "prompt_toolkit==3.0.53", "requests==2.34.2"]

[project.urls]
Homepage = "https://vibedgc.com"
Repository = "https://github.com/OpenPeach-ai/dgc"
Issues = "https://github.com/OpenPeach-ai/dgc/issues"

[tool.setuptools.dynamic]
version = { attr = "dgc.__version__" }

[project.scripts]
dgc = "dgc.cli:main"

[tool.setuptools.packages.find]
include = ["dgc*"]

[tool.setuptools.package-data]
dgc = ["skills_builtin/*/SKILL.md", "schemas/*.json"]
