[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dgc"
dynamic = ["version"]                       # single-sourced from dgc/__init__.py __version__
description = "Interactive coding-agent CLI harness for local LLMs (Ollama, LM Studio, vLLM, llama.cpp)"
requires-python = ">=3.10"
dependencies = ["rich>=13", "prompt_toolkit>=3", "requests>=2.31"]

[tool.setuptools.dynamic]
version = { attr = "dgc.__version__" }

[project.scripts]
dgc = "dgc.cli:main"

[tool.setuptools.packages.find]
include = ["dgc*"]

[tool.setuptools.package-data]
dgc = ["skills_builtin/*/SKILL.md"]
