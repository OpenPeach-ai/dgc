<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  The wide-font pass: `DGC_TEST_FONTS=wide npm test` (test/support/pin-fonts.mjs points Chromium's FONTCONFIG_FILE here).
  The same as fonts.conf with DejaVu Sans, a wide face, as the panel's words: the system-ui of many Linux desktops
  (Debian, minimal installs). It shows which words a wide font cuts; the suite itself is measured in fonts.conf's Noto
  Sans. Code stays DejaVu Sans Mono. Faces: test/fonts only (LICENSE-DejaVu.txt).
-->
<fontconfig>
  <!-- No cachedir: six faces scan instantly, and the browser then writes nothing anywhere. -->
  <dir prefix="relative">.</dir>

  <alias binding="same"><family>sans-serif</family><prefer><family>DejaVu Sans</family></prefer></alias>
  <alias binding="same"><family>serif</family><prefer><family>DejaVu Sans</family></prefer></alias>
  <alias binding="same"><family>system-ui</family><prefer><family>DejaVu Sans</family></prefer></alias>
  <!-- Chromium asks for system-ui by fontconfig's "sans", and any family nobody named gets the UI face. -->
  <alias binding="same"><family>sans</family><prefer><family>DejaVu Sans</family></prefer></alias>
  <match target="pattern"><edit name="family" mode="append_last"><string>DejaVu Sans</string></edit></match>
  <alias binding="same"><family>monospace</family><prefer><family>DejaVu Sans Mono</family></prefer></alias>

  <!-- Rasterisation is pinned too: distributions and desktops differ here (sub-pixel RGB on one, grey on another). -->
  <match target="font">
    <edit name="antialias" mode="assign"><bool>true</bool></edit>
    <edit name="hinting" mode="assign"><bool>true</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintslight</const></edit>
    <edit name="autohint" mode="assign"><bool>false</bool></edit>
    <edit name="rgba" mode="assign"><const>none</const></edit>
    <edit name="lcdfilter" mode="assign"><const>lcddefault</const></edit>
    <edit name="embeddedbitmap" mode="assign"><bool>false</bool></edit>
  </match>
</fontconfig>
