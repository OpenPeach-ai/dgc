<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  The whole font environment of the extension's browser tests (test/support/pin-fonts.mjs points Chromium's
  FONTCONFIG_FILE here): no /etc/fonts, no /usr/share/fonts, no ~/.config/fontconfig. A panel test measures words in
  pixels ("the button's words are whole at 300 px"), so the same font has to draw them on every machine. Before this
  (0.52.0, 27 Nov) a GitHub runner drew them in DejaVu Sans and this machine in Noto Sans: 80 layout tests failed there.

  The UI face is Noto Sans (the face these tests were measured in), Regular, Bold, Italic and Bold Italic, copied
  byte-for-byte from Ubuntu 24.04's fonts-noto-core (LICENSE-Noto.txt). Code is DejaVu Sans Mono, and anything Noto Sans
  has no glyph for (arrows, check marks) falls back to DejaVu Sans, both copied from fonts-dejavu-core 2.37
  (LICENSE-DejaVu.txt). wide.conf is the same with DejaVu Sans as the UI face: the wide-font pass.
-->
<fontconfig>
  <!-- No cachedir: six faces scan instantly, and the browser then writes nothing anywhere. -->
  <dir prefix="relative">.</dir>

  <alias binding="same"><family>sans-serif</family><prefer><family>Noto Sans</family><family>DejaVu Sans</family></prefer></alias>
  <alias binding="same"><family>serif</family><prefer><family>Noto Sans</family><family>DejaVu Sans</family></prefer></alias>
  <alias binding="same"><family>system-ui</family><prefer><family>Noto Sans</family><family>DejaVu Sans</family></prefer></alias>
  <!-- Chromium asks for system-ui by fontconfig's "sans", and any family nobody named gets the UI face. -->
  <alias binding="same"><family>sans</family><prefer><family>Noto Sans</family><family>DejaVu Sans</family></prefer></alias>
  <match target="pattern"><edit name="family" mode="append_last"><string>Noto Sans</string></edit></match>
  <alias binding="same"><family>monospace</family><prefer><family>DejaVu Sans Mono</family></prefer></alias>

  <!-- Rasterisation is pinned too: distributions and desktops differ here (sub-pixel RGB on one, grey on another). -->
  <match target="font">
    <edit name="antialias" mode="assign"><bool>true</bool></edit>
    <edit name="hinting" mode="assign"><bool>true</bool></edit>
    <edit name="hintstyle" mode="assign"><const>hintslight</const></edit>
    <edit name="autohint" mode="assign"><bool>false</bool></edit>
    <edit name="rgba" mode="assign"><const>none</const></edit>
    <edit name="lcdfilter" mode="assign"><const>lcddefault</const></edit>
    <edit name="embeddedbitmap" mode="assign"><bool>false</bool></edit>
  </match>
</fontconfig>
