# Publish sdk/python to PyPI as dgc-sdk. First upload needs a pending trusted
# publisher on pypi.org (project dgc-sdk, repo OpenPeach-ai/dgc, this workflow).
name: Publish dgc-sdk
on:
  workflow_dispatch:
  push:
    tags:
      - "sdk-v*"

permissions:
  contents: read
  id-token: write

jobs:
  pypi:
    name: Upload dgc-sdk to PyPI
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install build twine
      - run: python -m build sdk/python
      - run: python -m twine check --strict sdk/python/dist/*
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: sdk/python/dist
