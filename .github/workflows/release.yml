name: Release

on:
  push:
    tags: ["v[0-9]*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - name: Verify public tag identity
        shell: bash
        run: |
          git fetch --quiet origin main
          version=$(sed -n 's/^__version__ = "\([^"]*\)"$/\1/p' dgc/__init__.py)
          test "$GITHUB_REF_NAME" = "v$version"
          git merge-base --is-ancestor "${GITHUB_REF_NAME}^{commit}" origin/main
      - run: python -m pip install build
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install --no-deps -e .
      - run: bash scripts/preflight.sh
      - run: python -m build
      - run: bash scripts/build-release.sh
      - run: python scripts/release_bundle.py dist/release --bind-git . --require-public
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/release/dgc.tar.gz
            dist/release/dgc.cdx.json
            dist/*.whl
            dist/*.tar.gz
      - env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          dist/release/dgc.tar.gz
          dist/release/dgc.tar.gz.sha256
          dist/release/version.json
          dist/release/provenance.json
          dist/release/dgc.cdx.json
          dist/*.whl
          dist/dgc-*.tar.gz
          --verify-tag --generate-notes --title "DGC ${GITHUB_REF_NAME}"
