name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-tree:
    name: Public product tree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python scripts/check-public-content.py

  python:
    name: Python ${{ matrix.python }} · ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install --no-deps -e .
      - run: python -m pip check
      - run: python -m compileall -q dgc tests/run_tests.py
      - run: python -m py_compile bench/*.py scripts/generate-sbom.py
      - run: python tests/run_tests.py

  windows-smoke:
    name: Windows import and CLI smoke
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -r requirements.lock
      - run: python -m pip install --no-deps -e .
      - run: python -m compileall -q dgc
      - run: python -m dgc --version

  extension:
    name: VS Code / Cursor extension
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        id: python
        with:
          python-version: "3.13"
          cache: pip
      - name: Install the Python backend used by live panel tests
        working-directory: .
        run: |
          python -m pip install -r requirements.lock
          python -m pip install --no-deps -e .
          python -m pip check
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json
      - name: Install the browser the panel layout tests render in
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Install pinned VS Code extension host
        shell: bash
        run: test/install-pinned-vscode.sh "$RUNNER_TEMP/dgc-vscode-host"
      - name: Build and validate both release VSIX flavors in the real extension host
        shell: bash
        env:
          DGC_EXTENSION_OUT: ${{ runner.temp }}/dgc-extension-release
          DGC_VSCODE_EXECUTABLE: ${{ runner.temp }}/dgc-vscode-host/code
          DGC_EXPECT_VSCODE_VERSION: 1.107.1
          DGC_REQUIRE_CHROMIUM: "1"
          DGC_TEST_PYTHON: ${{ steps.python.outputs.python-path }}
        run: xvfb-run -a bash ../../scripts/release-extension.sh --build
      - uses: actions/upload-artifact@v7
        with:
          name: dgc-extension-ci
          path: ${{ runner.temp }}/dgc-extension-release/*

  package:
    name: Python package and release archive
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check dist/*
      - run: DGC_ALLOW_DIRTY=1 bash scripts/build-release.sh
      - run: (cd dist/release && sha256sum -c dgc.tar.gz.sha256)
      - uses: actions/upload-artifact@v7
        with:
          name: dgc-release-candidate
          path: |
            dist/release/dgc.tar.gz
            dist/release/dgc.tar.gz.sha256
            dist/release/version.json
            dist/release/provenance.json
            dist/release/dgc.cdx.json
